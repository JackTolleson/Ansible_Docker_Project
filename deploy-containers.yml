- name: Deploy Flask App to Kubernetes
  hosts: client-vm
  become: yes
  tasks:
    - name: Apply Flask Deployment and Service via kubectl
      shell: |
        cat <<EOF | microk8s kubectl apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: flask
        spec:
          replicas: 10
          selector:
            matchLabels:
              app: flask
          template:
            metadata:
              labels:
                app: flask
            spec:
              containers:
              - name: flask-app
                image: flask-app
                imagePullPolicy: IfNotPresent
                ports:
                - containerPort: 5000
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: flask
        spec:
          selector:
            app: flask
          ports:
          - protocol: TCP
            port: 5000
            targetPort: 5000
        EOF
      args:
        executable: /bin/bash
      environment:
        PATH: "/snap/bin:{{ ansible_env.PATH }}"

