---
- name: Configure containers on client
  hosts: client-vm
  become: yes
  tasks:
    - name: Install required dependencies
      dnf:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
        state: present

    - name: Add Docker repository
      command: >
        dnf config-manager --add-repo=https://download.docker.com/linux/centos/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Remove podman-docker if present (conflicts with Docker CE)
      dnf:
        name: podman-docker
        state: absent

    - name: Install Docker CE
      dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Install EPEL repository
      dnf:
        name: epel-release
        state: present

    - name: Install snapd
      dnf:
        name: snapd
        state: present

    - name: Enable and start snapd.socket
      systemd:
        name: snapd.socket
        enabled: yes
        state: started

    - name: Ensure /snap symlink exists
      file:
        src: /var/lib/snapd/snap
        dest: /snap
        state: link

    - name: Wait for snapd to seed the system
      command: snap version
      register: snap_check
      retries: 10
      delay: 10
      until: snap_check.rc == 0

    - name: Install MicroK8s via Snap
      command: snap install microk8s --classic
      environment:
        PATH: "/snap/bin:{{ ansible_env.PATH }}"

